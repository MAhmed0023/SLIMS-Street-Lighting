# streetlight.pera.gop.pk - use this instead of web.config if the portal is hosted on Nginx.
# Replace the host name and certificate paths with the real ones.
#
# The portal records who changed what in the audit trail. It ignores any X-Forwarded-For sent by
# a browser, so nobody can write a false address, and trusts only X-Real-IP set here.
#
# HTTPS is not optional for SLIMS: phone browsers only give the camera and GPS to a secure page,
# and Lighting Officers capture geo-stamped installation evidence that way.

server {
    listen 80;
    server_name streetlight.pera.gop.pk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name streetlight.pera.gop.pk;

    ssl_certificate     /etc/ssl/pera/streetlight.pera.gop.pk.crt;
    ssl_certificate_key /etc/ssl/pera/streetlight.pera.gop.pk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The API accepts evidence uploads up to 64 MB per request, so the limit has to clear that.
    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # A batch of photographs over a slow site connection must not be cut off mid-way.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
